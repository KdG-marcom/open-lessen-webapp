name: Data uit Airtable
on:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths-ignore: ["data.json"]
  workflow_dispatch:
permissions:
  contents: write
concurrency: data
jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build-data.js
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
      - name: Commit data.json als die veranderd is
        run: |
          if [ -n "$(git status --porcelain data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Data uit Airtable bijgewerkt"
            git push
          fi
